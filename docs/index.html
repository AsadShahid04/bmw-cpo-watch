<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BMW CPO 3 Series — DAP + HUD Watch</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231c69d4'/%3E%3Ctext x='16' y='22' font-family='Arial' font-size='17' font-weight='bold' fill='white' text-anchor='middle'%3E3%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --blue:#1c69d4; --blue-dark:#1559b8; --blue-soft:#9db8e8;
    --ink:#101828; --mut:#667085; --line:#e4e7ec; --line-soft:#f0f2f5;
    --green:#0a7a2f; --bg:#f6f7f9; --navy:#0b1e3a;
    --surface:#ffffff; --input-bg:#ffffff; --input-border:#d0d5dd;
    --badge-bg:#e8f0fe; --badge-ink:#174ea6; --badge-border:#c2d6f5;
    --match-bg:#d9ead3; --match-ink:#0a5c1e; --match-border:#b6dfa8;
    --drop-bg:#fce8e6; --drop-ink:#a50e0e; --drop-border:#f2b8b5;
    --new-bg:#fef7e0; --new-ink:#7a5a00; --new-border:#f5df9a;
    --hover-bg:#eef4fd;
    --shadow:0 1px 2px rgba(16,24,40,.05);
    --card-shadow:0 2px 8px rgba(16,24,40,.07);
    --car-shadow:0 4px 16px rgba(16,24,40,.10);
    color-scheme:light;
  }
  html[data-theme="dark"] {
    --blue:#6ea8fe; --blue-dark:#8ab8ff; --blue-soft:#3a5a8c;
    --ink:#e8ecf1; --mut:#9aa5b1; --line:#2b333f; --line-soft:#232b36;
    --green:#7bc98f; --bg:#0e1216;
    --surface:#171d24; --input-bg:#1e252e; --input-border:#3a4552;
    --badge-bg:#1d2f4d; --badge-ink:#a8c8f5; --badge-border:#2c4a75;
    --match-bg:#14301c; --match-ink:#8fd6a4; --match-border:#245c33;
    --drop-bg:#3d1a1a; --drop-ink:#f5a8a8; --drop-border:#6b2b2b;
    --new-bg:#3a2f10; --new-ink:#f2d98c; --new-border:#6b5518;
    --hover-bg:#1e2c40;
    --shadow:0 1px 2px rgba(0,0,0,.4);
    --card-shadow:0 2px 8px rgba(0,0,0,.4);
    --car-shadow:0 4px 16px rgba(0,0,0,.45);
    color-scheme:dark;
  }
  [hidden] { display:none !important; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; color:var(--ink); background:var(--bg); -webkit-font-smoothing:antialiased; }
  header { background:linear-gradient(135deg,#0b1e3a 0%,#123a6b 100%); color:#fff; }
  header .wrap { max-width:1060px; margin:0 auto; padding:26px 16px 20px; }
  .kicker { font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:#8fb4e3; margin-bottom:8px; }
  header h1 { margin:0 0 6px; font-size:24px; letter-spacing:-.01em; }
  header p { margin:4px 0; color:#c8d6ea; font-size:13.5px; line-height:1.5; max-width:720px; }
  .updated-pill { display:inline-block; margin-top:10px; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.18); border-radius:999px; padding:4px 11px; font-size:12px; color:#e6eefb; }
  main { max-width:1060px; margin:0 auto; padding:16px 12px 44px; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:14px; box-shadow:var(--shadow); }
  .health { display:flex; flex-wrap:wrap; }
  .stat { flex:1 1 auto; min-width:130px; padding:2px 16px; border-left:1px solid var(--line); }
  .stat:first-child { padding-left:0; border-left:none; }
  .stat-label { font-size:11px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; color:var(--mut); margin-bottom:2px; }
  .stat-value { font-size:17px; font-weight:700; color:var(--ink); white-space:nowrap; }
  .stat-value small { font-size:12px; font-weight:400; color:var(--mut); }
  .ok { color:var(--green); }
  h2 { font-size:17px; margin:2px 0 4px; letter-spacing:-.01em; }
  .panel h3 { font-size:12px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--mut); margin:16px 0 2px; }
  .panel h3:first-of-type { margin-top:8px; }
  .muted { color:var(--mut); font-size:13px; }
  .worth-row { display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:8px 0; border-top:1px solid var(--line-soft); text-decoration:none; color:inherit; }
  .worth-row:first-of-type { border-top:none; }
  .worth-row:hover .worth-title { color:var(--blue); text-decoration:underline; }
  .worth-title { font-weight:600; font-size:14px; }
  .worth-dealer { display:block; font-weight:400; font-size:12px; color:var(--mut); margin-top:1px; }
  .worth-price { font-weight:700; font-size:14px; white-space:nowrap; }
  .worth-price small { display:block; font-weight:400; font-size:11.5px; color:var(--mut); text-align:right; }
  .controls { position:sticky; top:8px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:12px; z-index:5; box-shadow:var(--card-shadow); }
  .controls .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  input[type=search], select { font:inherit; padding:10px 12px; min-height:44px; border:1px solid var(--input-border); border-radius:8px; background:var(--input-bg); color:var(--ink); }
  input[type=search]:focus, select:focus { outline:2px solid rgba(28,105,212,.35); border-color:var(--blue); }
  input[type=search] { flex:1 1 200px; }
  .tabs { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 8px; }
  .tab { border:1px solid var(--input-border); background:var(--surface); border-radius:999px; padding:8px 15px; font:inherit; font-size:13px; cursor:pointer; color:var(--ink); transition:border-color .12s, background .12s; }
  .tab:hover { border-color:var(--blue-soft); }
  .tab.on { background:var(--blue); border-color:var(--blue); color:#fff; font-weight:600; }
  .toggle { display:inline-flex; align-items:center; gap:8px; font-size:14px; background:var(--surface); border:1px solid var(--input-border); border-radius:999px; padding:10px 16px; min-height:40px; cursor:pointer; user-select:none; transition:border-color .12s; }
  .toggle:hover { border-color:var(--blue-soft); }
  .toggle input { accent-color:var(--blue); margin:0; width:16px; height:16px; }
  .car { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin-bottom:10px; transition:box-shadow .15s, border-color .15s; }
  .car:hover { box-shadow:var(--car-shadow); border-color:var(--blue-soft); }
  .car-top { display:flex; gap:12px; align-items:flex-start; }
  .swatches { display:flex; flex-direction:column; gap:6px; flex:0 0 auto; padding-top:2px; }
  .sw { display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--mut); white-space:nowrap; }
  .dot { width:18px; height:18px; border-radius:50%; border:1px solid rgba(0,0,0,.25); flex:0 0 auto; }
  .car-main { flex:1 1 auto; min-width:0; }
  .car-title { font-weight:700; font-size:16px; letter-spacing:-.01em; }
  .car-title a { color:inherit; text-decoration:none; }
  .car-title a:hover { color:var(--blue); text-decoration:underline; }
  .car-sub { color:var(--mut); font-size:13px; margin-top:2px; }
  .car-price { font-weight:700; font-size:18px; white-space:nowrap; text-align:right; letter-spacing:-.01em; }
  .car-price .miles { display:block; font-weight:400; font-size:12px; color:var(--mut); margin-top:2px; }
  .badges { display:flex; flex-wrap:wrap; gap:5px; margin-top:8px; }
  .badge { font-size:11px; font-weight:700; border-radius:999px; padding:3px 8px; background:var(--badge-bg); color:var(--badge-ink); border:1px solid var(--badge-border); }
  .badge.match { background:var(--match-bg); color:var(--match-ink); border-color:var(--match-border); }
  .badge.drop { background:var(--drop-bg); color:var(--drop-ink); border-color:var(--drop-border); }
  .badge.new { background:var(--new-bg); color:var(--new-ink); border-color:var(--new-border); }
  .pkgs { font-size:13px; color:var(--ink); margin-top:8px; line-height:1.5; }
  .pkgs.empty { color:var(--mut); font-style:italic; }
  details { margin-top:9px; font-size:13px; }
  details summary { cursor:pointer; color:var(--blue); font-weight:600; }
  details summary:hover { text-decoration:underline; }
  details dl { margin:9px 0 0; display:grid; grid-template-columns:130px 1fr; gap:4px 10px; }
  details dt { color:var(--mut); }
  details dd { margin:0; word-break:break-all; }
  details a { color:var(--blue); }
  .empty { text-align:center; color:var(--mut); padding:30px 0; }
  .btn { border:1px solid var(--input-border); background:var(--surface); border-radius:999px; padding:10px 24px; font:inherit; font-size:14px; font-weight:600; color:var(--blue); cursor:pointer; transition:background .12s; }
  .btn:hover { background:var(--hover-bg); }
  footer { font-size:12px; color:var(--mut); line-height:1.6; }
  footer p { margin:6px 0; }
  footer a { color:var(--blue); }
  .theme-btn { margin-left:auto; display:inline-flex; align-items:center; gap:6px; background:var(--surface); border:1px solid var(--input-border); color:var(--ink); border-radius:999px; padding:10px 14px; min-height:44px; font:inherit; font-size:13.5px; font-weight:600; cursor:pointer; }
  .theme-btn:hover { border-color:var(--blue-soft); }
  .theme-btn svg { display:block; }
  .filter-meta { margin-top:10px; }
  .link-btn { border:none; background:none; color:var(--blue); font:inherit; font-size:13px; font-weight:600; cursor:pointer; padding:4px 2px; }
  .link-btn:hover { text-decoration:underline; }
  @media (max-width:560px) {
    header h1 { font-size:20px; }
    .car-price { font-size:16px; }
    details dl { grid-template-columns:110px 1fr; }
    .stat { min-width:45%; padding:4px 12px; }
    .stat:nth-child(odd) { padding-left:0; border-left:none; }
  }
</style>
<script>
(function(){try{var s=localStorage.getItem("bmw-cpo-theme");var t=s||(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();
</script>
</head>
<body>
<header>
  <div class="wrap">
    <div class="kicker">BMW USA · Certified Pre-Owned · Daily Watch</div>
    <h1>BMW CPO 3 Series — DAP + HUD Watch</h1>
    <p>Certified pre-owned 3 Series nationwide, tracked daily. A car is a <b>match</b> when it has both Driving Assistance Professional (5AU) and a Head-Up Display (6U3/610).</p>
    <p><span class="updated-pill" id="updated">Loading…</span></p>
  </div>
</header>
<main>
  <div class="card">
    <div class="health" id="health"></div>
  </div>

  <div class="card panel" id="worth">
    <h2>Worth knowing</h2>
    <div id="worth-body"><p class="muted">Loading…</p></div>
  </div>

  <div class="controls">
    <div class="row">
      <input type="search" id="q" placeholder="Search VIN, dealer, color, model…" aria-label="Search cars">
      <select id="sort" aria-label="Sort">
        <option value="price-asc">Price: low to high</option>
        <option value="price-desc">Price: high to low</option>
        <option value="miles-asc">Mileage: low to high</option>
        <option value="newest">Newest listed first</option>
      </select>
      <select id="maxprice" aria-label="Max price">
        <option value="">Any price</option>
        <option value="30000">Up to $30,000</option>
        <option value="35000">Up to $35,000</option>
        <option value="40000">Up to $40,000</option>
        <option value="50000">Up to $50,000</option>
      </select>
      <select id="maxmiles" aria-label="Max mileage">
        <option value="">Any mileage</option>
        <option value="20000">Up to 20k mi</option>
        <option value="30000">Up to 30k mi</option>
        <option value="40000">Up to 40k mi</option>
        <option value="50000">Up to 50k mi</option>
      </select>
      <button id="theme-toggle" class="theme-btn" aria-label="Switch to dark mode"><span id="theme-icon"></span><span id="theme-label">Dark</span></button>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="row">
      <label class="toggle"><input type="checkbox" id="f-match"> Matches only</label>
      <label class="toggle"><input type="checkbox" id="f-dap"> DAP Pro</label>
      <label class="toggle"><input type="checkbox" id="f-hud"> Head-Up Display</label>
      <label class="toggle"><input type="checkbox" id="f-msport"> M Sport</label>
      <label class="toggle"><input type="checkbox" id="f-drop"> Price dropped</label>
    </div>
    <div class="row filter-meta" id="filter-meta" hidden>
      <span class="muted" id="filter-count"></span>
      <button id="clear-filters" class="link-btn">Clear all filters</button>
    </div>
  </div>

  <p class="muted" id="count"></p>
  <div id="list"></div>
  <p style="text-align:center"><button id="more" class="btn">Show more</button></p>

  <div class="card">
    <footer id="notes"></footer>
  </div>
</main>
<script>
const BAY_AREA_HOSTS = ["eastbaybmw.com","bmwoffremont.com","bmwconcord.com","stevenscreekbmw.com","bmwofmountainview.com","bmwofberkeley.com","bmwofsanmateo.com","bmwofnapa.com","bmwofsanrafael.com","hanselbmw.com","weatherford bmw"];
let DATA = null, shown = 0;
const PAGE = 50;
const $ = id => document.getElementById(id);
const money = n => n == null ? "—" : "$" + Math.round(n).toLocaleString("en-US");
const miles = n => n == null ? "—" : Math.round(n).toLocaleString("en-US") + " mi";
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hostOf = u => { try { return new URL(u).hostname.replace(/^www\./,""); } catch(e){ return ""; } };
function dealerName(c){
  const d = (c.dealer || "").trim();
  if (d && !/^\d/.test(d)) return d;
  const h = hostOf(c.url || "");
  return h || d || "Unknown dealer";
}
function isBayArea(c){
  const h = hostOf(c.url || "").toLowerCase();
  return BAY_AREA_HOSTS.some(x => h.includes(x));
}
function fmtDate(epoch){
  if (!epoch) return "—";
  return new Date(epoch*1000).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
}
function fmtDT(iso){
  if (!iso) return "—";
  return new Date(iso).toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
}

let tab = "all";
const TABS = [["all","All"],["matches","Matches"],["norcal","NorCal"],["socal","SoCal"],["rest","Nationwide"],["gone","Gone"]];
function renderTabs(){
  $("tabs").innerHTML = TABS.map(([k,label])=>{
    const n = k==="all" ? DATA.cars.length
      : k==="matches" ? DATA.counts.matches
      : k==="gone" ? DATA.counts.gone_recent
      : (DATA.regions[k] ? DATA.regions[k].inventory : 0);
    return `<button class="tab${tab===k?" on":""}" data-tab="${k}">${label} (${n})</button>`;
  }).join("");
  document.querySelectorAll("#tabs .tab").forEach(b => b.onclick = ()=>{ tab=b.dataset.tab; shown=0; renderTabs(); render(); updateFilterState(); });
}

function filtered(){
  const q = $("q").value.trim().toLowerCase();
  const maxP = $("maxprice").value ? +$("maxprice").value : Infinity;
  const maxM = $("maxmiles").value ? +$("maxmiles").value : Infinity;
  const dropMap = new Map(DATA.price_drops.map(d=>[d.vin,d]));
  let list = DATA.cars.filter(c => {
    if (tab==="matches" && !c.status.includes("match")) return false;
    if (tab==="norcal" && c.region!=="norcal") return false;
    if (tab==="socal" && c.region!=="socal") return false;
    if (tab==="rest" && c.region!=="rest") return false;
    if ($("f-match").checked && !c.status.includes("match")) return false;
    if ($("f-dap").checked && !c.has_dap) return false;
    if ($("f-hud").checked && !c.has_hud) return false;
    if ($("f-msport").checked && !c.has_msport) return false;
    if ($("f-drop").checked && !dropMap.has(c.vin)) return false;
    if (c.price != null && c.price > maxP) return false;
    if (c.miles != null && c.miles > maxM) return false;
    if (q){
      const hay = [c.vin,c.year,c.model,c.trim,c.ext_color,c.int_color,dealerName(c),c.dealer].join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  const s = $("sort").value;
  if (s==="price-asc") list.sort((a,b)=>(a.price??1e12)-(b.price??1e12));
  if (s==="price-desc") list.sort((a,b)=>(b.price??-1)-(a.price??-1));
  if (s==="miles-asc") list.sort((a,b)=>(a.miles??1e12)-(b.miles??1e12));
  if (s==="newest") list.sort((a,b)=>(b.first_seen||0)-(a.first_seen||0));
  return {list, dropMap};
}
function goneList(){
  return DATA.gone.map(g => ({
    vin:g.vin, year:g.year, model:g.model, trim:"", ext_color:g.color_name, ext_hex:"#9A9DA0",
    int_color:"", int_hex:"#9A9DA0", price:g.price, miles:g.mileage, dealer:"", distance:g.dealer_distance,
    region:g.region, url:g.url, packages:[], has_dap:false, has_hud:false, has_msport:false,
    status:["gone"], first_seen:null, last_seen:g.last_seen, _gone:true
  }));
}

function carTitle(c){
  // The API's model/trim overlap messily ("330i" / "330i xDrive",
  // "340i" / "M340i xDrive", "330i xDrive" / "xDrive") — pick the fuller
  // name instead of concatenating both, and drop junk "NA" tokens.
  const y = c.year || "";
  const m = (c.model || "").trim();
  const t = (c.trim || "").trim();
  let name = m;
  if (t && t !== m) {
    if (m && t.startsWith(m)) name = t;
    else if (m && m.endsWith(t)) name = m;
    else if (m && t.includes(m)) name = t;
    else name = (m ? m + " " : "") + t;
  }
  name = name.split(/\s+/).filter(w => w.toUpperCase() !== "NA").join(" ");
  return `${y} BMW ${name}`.replace(/\s+/g," ").trim();
}

function carHTML(c, dropMap){
  const drop = dropMap.get(c.vin);
  const badges = [];
  if (c.status.includes("dap-hud")) badges.push('<span class="badge match">DAP + HUD MATCH</span>');
  else if (c.status.includes("g20")) badges.push('<span class="badge match">G20 MATCH</span>');
  if (c.status.includes("new")) badges.push('<span class="badge new">NEW</span>');
  if (drop) badges.push(`<span class="badge drop">Price drop · was ${money(drop.old_price)}</span>`);
  if (c._gone) badges.push('<span class="badge">GONE / DELISTED</span>');
  if (isBayArea(c)) badges.push('<span class="badge">Bay Area</span>');
  const pkgs = (c.packages||[]).map(p=>{
    const e = esc(p);
    return (p === "Driving Assistance Professional" || p.indexOf("Head-Up Display") === 0) ? `<strong>${e}</strong>` : e;
  }).join(" · ");
  const title = carTitle(c);
  const sw = [];
  if (c.ext_color) sw.push(`<span class="sw"><span class="dot" style="background:${esc(c.ext_hex)}"></span>${esc(c.ext_color)}</span>`);
  if (c.int_color) sw.push(`<span class="sw"><span class="dot" style="background:${esc(c.int_hex)}"></span>${esc(c.int_color)}</span>`);
  const intRow = c.int_color
    ? `<dt>Interior</dt><dd>${esc(c.int_color)} (${esc(c.int_hex)})${c.upholstery?` · ${esc(c.upholstery)}`:""}</dd>` : "";
  return `<article class="car">
    <div class="car-top">
      <div class="swatches">${sw.join("")}</div>
      <div class="car-main">
        <div class="car-title"><a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(title)}</a></div>
        <div class="car-sub">${esc(dealerName(c))}${c.distance!=null?` · ${Math.round(c.distance)} mi away`:""}${c.carfax_1owner?" · 1-owner":""}</div>
        <div class="badges">${badges.join("")}</div>
        <div class="pkgs${pkgs?"":" empty"}">${pkgs?pkgs:"No package details listed"}</div>
        <details><summary>Details</summary>
          <dl>
            <dt>VIN</dt><dd>${esc(c.vin)}</dd>
            <dt>Exterior</dt><dd>${esc(c.ext_color||"—")} (${esc(c.ext_hex)})</dd>
            ${intRow}
            <dt>First seen</dt><dd>${fmtDate(c.first_seen)}</dd>
            <dt>Last seen</dt><dd>${fmtDate(c.last_seen)}</dd>
            <dt>Listing</dt><dd><a href="${esc(c.url)}" target="_blank" rel="noopener">Dealer listing ↗</a></dd>
          </dl>
        </details>
      </div>
      <div class="car-price">${money(c.price)}<span class="miles">${miles(c.miles)}</span></div>
    </div>
  </article>`;
}

function activeFilterCount(){
  let n = 0;
  if ($("q").value.trim()) n++;
  if ($("maxprice").value) n++;
  if ($("maxmiles").value) n++;
  ["f-match","f-dap","f-hud","f-msport","f-drop"].forEach(id=>{ if ($(id).checked) n++; });
  if (tab !== "all") n++;
  return n;
}
function updateFilterState(){
  const n = activeFilterCount();
  $("filter-meta").hidden = n === 0;
  $("filter-count").textContent = n ? `${n} filter${n===1?"":"s"} active` : "";
}
function render(){
  let {list, dropMap} = filtered();
  if (tab==="gone") list = goneList();
  const total = list.length;
  const slice = list.slice(0, shown + PAGE);
  shown = slice.length;
  $("count").textContent = total === 0 ? "No cars match these filters."
    : `Showing ${shown} of ${total.toLocaleString()} car${total===1?"":"s"}.`;
  $("list").innerHTML = slice.map(c=>carHTML(c,dropMap)).join("") || '<p class="empty">Nothing here yet — try widening the filters.</p>';
  $("more").style.display = shown < total ? "" : "none";
}

function renderWorth(){
  const now = Date.now()/1000, week = 7*86400;
  const byVin = new Map(DATA.cars.map(c=>[c.vin,c]));
  const drops = DATA.price_drops.slice().sort((a,b)=>b.drop-a.drop);
  const fresh = DATA.cars.filter(c =>
    (c.status.includes("dap-hud") || c.status.includes("g20")) &&
    (Math.max(c.first_matched_dap||0, c.first_matched_g20||0) > now - week)
  );
  const bayFresh = fresh.filter(isBayArea);
  let html = "";
  html += "<h3>Price drops (last 7 days)</h3>";
  html += drops.length
    ? drops.slice(0,10).map(d=>{
        const car = byVin.get(d.vin);
        const href = car && car.url ? ` href="${esc(car.url)}" target="_blank" rel="noopener"` : "";
        return `<a class="worth-row"${href}><span class="worth-main"><span class="worth-title">${esc(d.year)} ${esc(d.model)} · ${esc(d.color)}</span><span class="worth-dealer">was ${money(d.old_price)} · down ${money(d.drop)}</span></span><span class="worth-price">${money(d.new_price)}</span></a>`;
      }).join("")
    : `<p class="muted">No price drops in the last 7 days.</p>`;
  html += "<h3>New DAP + HUD matches (last 7 days)</h3>";
  html += fresh.length
    ? fresh.slice(0,10).map(c=>
        `<a class="worth-row" href="${esc(c.url)}" target="_blank" rel="noopener"><span class="worth-main"><span class="worth-title">${esc(c.year)} ${esc(c.model)} · ${esc(c.ext_color)}</span><span class="worth-dealer">${esc(dealerName(c))}${isBayArea(c)?" · Bay Area":""}</span></span><span class="worth-price">${money(c.price)}</span></a>`
      ).join("")
    : `<p class="muted">No new DAP + HUD matches in the last 7 days.</p>`;
  if (bayFresh.length) html += `<p class="muted">${bayFresh.length} of the new matches ${bayFresh.length===1?"is":"are"} in the Bay Area.</p>`;
  $("worth-body").innerHTML = html;
}

fetch("data.json").then(r=>r.json()).then(d=>{
  DATA = d;
  $("updated").textContent = `Last updated ${fmtDT(d.generated_at)} · data refreshes daily after the morning hunt.`;
  $("health").innerHTML =
    `<div class="stat"><div class="stat-label">Database</div><div class="stat-value ok">${esc(d.db.integrity)}</div></div>` +
    `<div class="stat"><div class="stat-label">Active listings</div><div class="stat-value">${d.db.listings_active.toLocaleString()}</div></div>` +
    `<div class="stat"><div class="stat-label">DAP + HUD matches</div><div class="stat-value">${d.counts.matches}</div></div>` +
    `<div class="stat"><div class="stat-label">G20 matches</div><div class="stat-value">${d.counts.g20_matches}</div></div>` +
    `<div class="stat"><div class="stat-label">Last watcher run</div><div class="stat-value">${fmtDT(d.db.last_run)} <small>(${esc(d.db.last_run_status||"")})</small></div></div>`;
  $("notes").innerHTML =
    (d.notes||[]).map(n=>`<p>${esc(n)}</p>`).join("") +
    `<p>Listings are BMW USA certified pre-owned 3 Series, tracked by an automated daily watcher. Prices and availability change — always verify on the dealer listing before acting. Hex swatches are approximations from color names.</p>`;
  renderTabs(); renderWorth(); render();
  $("clear-filters").onclick = ()=>{
    $("q").value = ""; $("sort").value = "price-asc"; $("maxprice").value = ""; $("maxmiles").value = "";
    ["f-match","f-dap","f-hud","f-msport","f-drop"].forEach(id=>{ $(id).checked = false; });
    tab = "all"; shown = 0; renderTabs(); render(); updateFilterState();
  };
  const MOON = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
  const SUN = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>';
  function updateThemeBtn(){
    const dark = document.documentElement.getAttribute("data-theme") === "dark";
    $("theme-icon").innerHTML = dark ? SUN : MOON;
    $("theme-label").textContent = dark ? "Light" : "Dark";
    $("theme-toggle").setAttribute("aria-label", dark ? "Switch to light mode" : "Switch to dark mode");
  }
  $("theme-toggle").onclick = ()=>{
    const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("bmw-cpo-theme", next); } catch(e){}
    updateThemeBtn();
  };
  updateThemeBtn(); updateFilterState();
  ["q","sort","maxprice","maxmiles","f-match","f-dap","f-hud","f-msport","f-drop"].forEach(id=>{
    $(id).addEventListener("input", ()=>{ shown=0; render(); updateFilterState(); });
    $(id).addEventListener("change", ()=>{ shown=0; render(); updateFilterState(); });
  });
  $("more").onclick = ()=>render();
}).catch(err=>{
  $("updated").textContent = "Could not load data.json — " + err.message;
});
</script>
</body>
</html>
